openapi: 3.0.3
info:
  title: API del Diagnóstico de Perfil Emprendedor
  version: 1.0.0
  description: >
    Un único endpoint. Valida el envío, recalcula el resultado con la misma
    lógica de puntaje que usa el navegador y lo registra mediante el repositorio.
    El navegador NO envía puntajes: si los envía, se ignoran.
servers:
  - url: /api
paths:
  /submissions:
    post:
      summary: Registrar un diagnóstico completo
      operationId: createSubmission
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/SubmissionRequest'
            example:
              email: estudiante@unisabana.edu.co
              programId: ingenieria-industrial
              consentAccepted: true
              consentTextVersion: "2026-11"
              answers:
                "1.1": 2
                "1.2": 3
                "1.3": 1
                "1.4": 3
                "1.5": 3
                "...": "(45 claves, 1 a 4)"
      responses:
        '201':
          description: Envío validado, puntuado y registrado.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/SubmissionResponse'
        '400':
          description: >
            Envío inválido (correo, dominio, programa, consentimiento o
            respuestas). No se registra nada.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
        '405':
          description: Método distinto de POST.
        '500':
          description: >
            Fallo al registrar. El cliente debe mostrar el resultado calculado
            localmente y un aviso no bloqueante.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ErrorResponse'
components:
  schemas:
    ProfileId:
      type: string
      enum:
        - realista-gerencial
        - realizador-comerciante
        - artistico-imaginativo
        - movilizador-social
        - investigativo-creador
    SubmissionRequest:
      type: object
      required: [email, programId, consentAccepted, consentTextVersion, answers]
      properties:
        email:
          type: string
          description: >
            Correo institucional. Se recorta y se pasa a minúsculas; el dominio
            debe ser exactamente ALLOWED_EMAIL_DOMAIN (por defecto unisabana.edu.co).
        programId:
          type: string
          description: Id existente en programs.json.
        consentAccepted:
          type: boolean
          description: Debe ser true (Ley 1581 de 2012).
        consentTextVersion:
          type: string
        answers:
          type: object
          description: Exactamente las 45 claves "x.n" (x 1-9, n 1-5), valores enteros 1 a 4.
          additionalProperties:
            type: integer
            minimum: 1
            maximum: 4
    SubmissionResponse:
      type: object
      required: [id, scores, dominant, secondary, submittedAt]
      properties:
        id:
          type: string
          format: uuid
        scores:
          type: object
          description: Un puntaje entero 9-36 por ProfileId.
          additionalProperties:
            type: integer
            minimum: 9
            maximum: 36
        dominant:
          type: array
          minItems: 1
          items:
            $ref: '#/components/schemas/ProfileId'
        secondary:
          type: array
          items:
            $ref: '#/components/schemas/ProfileId'
        submittedAt:
          type: string
          format: date-time
    ErrorResponse:
      type: object
      required: [error]
      properties:
        error:
          type: string
          description: Mensaje en español apto para mostrar.
        fields:
          type: object
          description: Errores por campo (email, programId, consentAccepted, answers).
          additionalProperties:
            type: string
